<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>Lista de Cosméticos</title> 
</head> 
<body> 
  <h1>Lista de Cosméticos</h1> 
  <ul id="lista"></ul> 
  <p id="total"></p> 
 
  <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #fff0f6, #ffd6e7); min-height: 100vh; padding: 50px 20px; color: #4a1830; } h1 { text-align: center; color: #c2185b; font-size: 38px; margin-bottom: 35px; text-shadow: 1px 2px 5px rgba(194, 24, 91, 0.15); } #lista { list-style: none; max-width: 700px; margin: 0 auto 30px; } #lista li { background: rgba(255, 255, 255, 0.95); margin-bottom: 15px; padding: 18px 22px; border-radius: 15px; border-left: 6px solid #e91e63; box-shadow: 0 5px 15px rgba(194, 24, 91, 0.12); font-size: 18px; transition: 0.3s ease; } #lista li:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(194, 24, 91, 0.2); background: #ffffff; } #total { max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; background: #c2185b; color: white; border-radius: 15px; font-size: 22px; font-weight: bold; box-shadow: 0 6px 18px rgba(194, 24, 91, 0.25); } </style>  
  <script src="dist/main.js"></script> 
</body> 
</html>
