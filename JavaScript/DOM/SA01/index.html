<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situação de Aprendizagem 01</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="formulario">

        <img src="Img/imagem.png" width="50px" height="50px">

        <h6>Cadastro de Usuário</h6>

        <p>Preencha os campos abaixo para criar seu cadastro</p>
        <br>

        <p>Nome:</p>
        <input type="text" id="nomeLabel" placeholder="Nome">

        <p>Sobrenome:</p>
        <input type="text" id="sobrenome" placeholder="Sobrenome">
        <br>

        <p>Data de Nascimento:</p>
        <input type="date" id="dataNascimento" placeholder="Data de Nascimento">
        <br>

        <p>E-mail:</p>
        <input type="email" id="email" placeholder="exemplo@email.com">
        <br>

        <p>CPF:</p>
        <input type="text" id="cpf" placeholder="000.000.000-00">
        <br>

        <p>RG:</p>
        <input type="text" id="rg" placeholder="00.000.000-0">
        <br>

        <p>Telefone:</p>
        <input type="text" id="Telefone" placeholder="(00) 00000-0000" class="text area"><br>
        <button id="adicionarTelefone">Adicionar Novo Telefone</button>
        <ul id="listaDeTelefones"></ul>
        <span>Clique sobre o telefone para exclui-lo</span>

        <p>Endereço:</p>
        <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Cidade, Estado">
        <br>

        <p>Selecione seu gênero</p><br>
        <select id="sexo">
            <option value="">Gênero</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select><br><br>

        <div class="daSenha">
            <p>Senha:</p>
            <input type="password" id="senha">
            <i class="bi bi-eye-fill icone" id="mostrarSenha"></i>
        </div>

        <div class="daSenha">
            <p>Confirmar Senha:</p>
            <input type="password" id="confirmarSenha">
            <i class="bi bi-eye-fill icone" id="mostrarConfirmarSenha"></i>
        </div>
        <br>

        <button id="cadastrar">Cadastrar</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
