<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Galeria 💗</title>

    <link rel="stylesheet" href="atividade01.css">
</head>

<body>

    <header class="topo">
        <div class="coracao">♡</div>

        <h1>Minha Galeria</h1>

        <p>Guarde seus momentos favoritos 💕</p>
    </header>


    <main class="container">

        <section class="camera-card">

            <h2>📸 Tire uma foto</h2>

            <p class="descricao">
                Ative sua câmera e registre um momento especial!
            </p>

            <video id="camera" autoplay></video>

            <div class="botoes">
                <button onclick="iniciarCamera()" class="btn-camera">
                    Ativar Câmera
                </button>

                <button onclick="tirarFoto()" class="btn-foto">
                    ♡ Tirar Foto
                </button>
            </div>

            <canvas id="canvas"></canvas>

            <p id="mensagem"></p>

        </section>


        <section class="galeria-card">

            <div class="titulo-galeria">
                <h2> Minhas Fotos</h2>

                <span id="contador">0 fotos</span>
            </div>

            <div id="galeria" class="galeria">

                <div id="semFotos" class="sem-fotos">
                    <div>📷</div>
                    <p>Ainda não há fotos aqui...</p>
                    <span>Tire sua primeira foto! ♡</span>
                </div>

            </div>

        </section>

    </main>


    


    <script src="atividade01.js"></script>

</body>

</html>
